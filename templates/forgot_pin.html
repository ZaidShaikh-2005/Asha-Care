<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot PIN - ASHA Care</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .card {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 42px;

            border-radius: 18px;

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.08);
        }


        .logo {
            width: 58px;
            height: 58px;

            border-radius: 14px;

            background: #168a43;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: 700;
            font-size: 17px;

            margin-bottom: 25px;
        }


        h1 {
            color: #172033;
            font-size: 28px;
            margin-bottom: 9px;
        }


        .subtitle {
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }


        .error-message {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 13px;

            margin-bottom: 20px;
        }


        .success-message {
            background: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;

            padding: 12px 14px;

            border-radius: 8px;

            font-size: 13px;

            margin-bottom: 20px;

            line-height: 1.5;
        }


        label {
            display: block;

            color: #172033;

            font-size: 14px;
            font-weight: 600;

            margin-bottom: 9px;
        }


        input {
            width: 100%;
            height: 50px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            padding: 0 14px;

            font-size: 14px;

            outline: none;
        }


        input:focus {
            border-color: #159447;

            box-shadow:
                0 0 0 3px rgba(21, 148, 71, 0.12);
        }


        button {
            width: 100%;
            height: 50px;

            border: none;

            border-radius: 9px;

            background: #168a43;

            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            margin-top: 20px;
        }


        button:hover {
            background: #117438;
        }


        .back-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #168a43;

            font-size: 13px;
            font-weight: 600;

            text-decoration: none;
        }


        .back-link:hover {
            text-decoration: underline;
        }


        @media (max-width: 500px) {

            .card {
                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>


<div class="card">

    <div class="logo">
        ASHA
    </div>


    <h1>
        Forgot PIN?
    </h1>


    <p class="subtitle">
        Enter the email address registered with your
        ASHA Care account. We will send you a secure
        link to create a new 6-digit PIN.
    </p>


    {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

    {% endif %}


    {% if success %}

        <div class="success-message">
            {{ success }}
        </div>

    {% endif %}


    {% if not success %}

        <form method="POST">

            {% csrf_token %}


            <label for="email">
                Registered Email Address
            </label>


            <input
                type="email"
                id="email"
                name="email"
                value="ashaanursing2026@gmail.com"
                autocomplete="email"
                required
            >


            <button type="submit">
                Send Reset Link
            </button>

        </form>

    {% endif %}


    <a
        href="{% url 'login' %}"
        class="back-link"
    >
        ← Back to Login
    </a>

</div>


</body>
</html>
